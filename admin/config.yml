backend:
  name: github
  repo: desskwok/castinghomecraft-site
  branch: main
  base_url: https://decap-oauth.netlify.app

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "renovation"
    label: "全屋翻新工程"
    folder: "content/renovation"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "標題", name: "title", widget: "string"}
      - {label: "地區", name: "location", widget: "string"}
      - {label: "工程類型", name: "type", widget: "string", default: "全屋翻新"}
      - {label: "封面圖片", name: "thumbnail", widget: "image"}
      - {label: "介紹", name: "description", widget: "text"}
      - {label: "圖片", name: "images", widget: "list", field: {label: "圖片", name: "image", widget: "image"}}
      - {label: "發布日期", name: "date", widget: "datetime"}
      - {label: "排序", name: "order", widget: "number", default: 0}

  - name: "maintenance"
    label: "維修案例"
    folder: "content/maintenance"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "標題", name: "title", widget: "string"}
      - {label: "地區", name: "location", widget: "string"}
      - {label: "工程類型", name: "type", widget: "select", options: ["天花維修", "牆身翻新", "訂造及安裝", "安裝", "其他"]}
      - {label: "封面圖片", name: "thumbnail", widget: "image"}
      - {label: "介紹", name: "description", widget: "text"}
      - {label: "圖片", name: "images", widget: "list", field: {label: "圖片", name: "image", widget: "image"}}
      - {label: "發布日期", name: "date", widget: "datetime"}
      - {label: "排序", name: "order", widget: "number", default: 0}
